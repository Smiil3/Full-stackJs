class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const tickets = [
      { holder: 'Camille D.', code: 'NDG-7K4M-2Q-01' },
      { holder: 'Invité·e de Camille D.', code: 'NDG-7K4M-2Q-02' }
    ];
    const i = this.state.i;
    return {
      ...tickets[i],
      n: i + 1,
      isFirst: i === 0, isLast: i === tickets.length - 1,
      qrLabel: 'QR code du billet ' + tickets[i].code,
      prev: () => this.setState({ i: Math.max(0, i - 1) }),
      next: () => this.setState({ i: Math.min(tickets.length - 1, i + 1) })
    };
  }
}
</script>
